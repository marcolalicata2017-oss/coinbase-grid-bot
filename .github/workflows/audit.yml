name: Audit e Auto-Tuning AI

on:
  schedule:
    # Esecuzione automatica ogni giorno alle 21:00 UTC
    - cron: '0 21 * * *'
  workflow_dispatch: # Permette l'esecuzione manuale da GitHub

jobs:
  audit:
    runs-on: ubuntu-latest

    # PERMESSI FONDAMENTALI PER IL COMMIT AUTOMATICO
    permissions:
      contents: write

    steps:
      - name: Checkout Codice
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configura Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Installa Dipendenze
        run: |
          pip install pandas google-genai requests

      - name: Esegui AI Auditor
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python ai_auditor.py
