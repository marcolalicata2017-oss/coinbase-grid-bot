name: Bot Coinbase Grid & Circuit Breaker

on:
  workflow_dispatch: # Permette l'avvio manuale da interfaccia GitHub

permissions:
  contents: write

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          persist-credentials: true

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install coinbase-advanced-py pandas numpy requests scikit-learn joblib

      - name: Run Bot Script
        env:
          COINBASE_KEY_NAME: ${{ secrets.COINBASE_KEY_NAME }}
          COINBASE_KEY_SECRET: ${{ secrets.COINBASE_KEY_SECRET }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python bot_coinbase_github.py

      - name: Commit and Push CSV Reports
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add *.csv *.txt || true
          git commit -m "📊 [AUTOMATION] Aggiornamento automatico report e diario" || exit 0
          git push origin main
